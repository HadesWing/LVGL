# =============================================================================
# OEM 现场微调文件（放到可执行文件同目录，或 config/oem.ini）
#
# 优先级：环境变量 OEM_PROFILE > 本文件 profile= > 编译期默认
# 生效顺序：先选 profile，再用本文件里的 color./text./layout. 覆盖
#
# 用法示例：
#   OEM_PROFILE=alt ./bin/main.exe     # 只看 profile，不碰 ini
#   OEM_INI=my.ini ./bin/main.exe      # 指定别的配置文件
#
# 改完重启就生效，**不需要重新编译**。定型后把值固化成 src/oem/oem_xxx.c。
# =============================================================================

# ---- 选择 profile（default / alt）----
# profile=alt

# ---- 配色（0xRRGGBB）----
# color.primary=0x2F80ED
# color.bg=0xECEFF1
# color.surface=0x37474F
# color.card=0xFFFFFF
# color.bar=0x263238
# color.bar_text=0xFFFFFF
# color.text=0x263238
# color.text_muted=0x607D8B
# color.border=0xCFD8DC
# color.ok=0x2E7D32
# color.danger=0xC62828

# ---- 文案（注意：新字要先重跑 scripts/gen_font.py，否则会显示方框）----
# text.product=我的家
# text.brand=ACME
# text.sip_offline=对讲未连接
# text.sip_online=对讲就绪
# text.scene0=回家
# text.room0=客厅
# text.cat_light=照明

# ---- 布局（像素）----
# layout.home_style=grid           # grid | list
# layout.bar_h=34
# layout.title_h=46
# layout.scene_h=56
# layout.card_w=140
# layout.card_h=88
# layout.gap=10
# layout.radius=14
# layout.pad=10
# layout.show_scene_bar=1
# layout.show_clock=1
# layout.show_brand=0
# layout.show_voice_bar=1

# ---- 功能开关：sip / voice / video，可用逗号组合 ----
# caps=sip,voice
